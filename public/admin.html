<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Telegram Sales Manager</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans Ethiopic", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: linear-gradient(135deg, #1261ff, #5b8cff);
      color: white;
      padding: 22px;
      border-radius: 0 0 25px 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .header h1 {
      font-size: 22px;
    }

    .header p {
      margin-top: 5px;
      opacity: .85;
      font-size: 13px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .refresh {
      background: rgba(255,255,255,.18);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .card .icon {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .card .label {
      color: #78839a;
      font-size: 13px;
    }

    .card .value {
      font-size: 23px;
      font-weight: bold;
      margin-top: 5px;
    }

    .section {
      margin: 0 18px 20px;
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .section-header h2 {
      font-size: 18px;
    }

    .status {
      font-size: 12px;
      color: #667085;
    }

    /* ADD PRODUCT */

    .product-form {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      color: #667085;
      font-weight: bold;
    }

    .field input {
      width: 100%;
      border: 1px solid #dce2eb;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    .field input:focus {
      border-color: #1261ff;
      box-shadow: 0 0 0 3px rgba(18,97,255,.10);
    }

    .save-btn {
      background: #1261ff;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: bold;
      min-height: 43px;
    }

    .save-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      display: none;
      font-size: 13px;
    }

    .message.success {
      display: block;
      background: #e7f8ee;
      color: #087443;
    }

    .message.error {
      display: block;
      background: #ffe8e8;
      color: #b42318;
    }

    /* PRODUCTS */

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .product {
      border: 1px solid #e7ebf2;
      border-radius: 16px;
      padding: 15px;
      background: #fbfcff;
    }

    .product-name {
      font-weight: bold;
      color: #1261ff;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .product-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .product-info div {
      background: white;
      padding: 8px;
      border-radius: 9px;
      font-size: 12px;
    }

    .product-info span {
      display: block;
      color: #7a8499;
      font-size: 10px;
      margin-bottom: 3px;
    }

    /* ORDERS */

    .orders {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .order {
      border: 1px solid #e7ebf2;
      border-radius: 16px;
      padding: 15px;
      background: #fbfcff;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .order-id {
      font-weight: bold;
      color: #1261ff;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .pending {
      background: #fff4cc;
      color: #9a6b00;
    }

    .confirmed {
      background: #dff8e8;
      color: #087443;
    }

    .cancelled {
      background: #ffe3e3;
      color: #b42318;
    }

    .rejected {
      background: #ffe3e3;
      color: #b42318;
    }

    .order-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      font-size: 13px;
    }

    .info {
      background: white;
      padding: 9px;
      border-radius: 10px;
    }

    .info span {
      display: block;
      color: #7a8499;
      font-size: 11px;
      margin-bottom: 3px;
    }

    .profit {
      color: #087443;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #8a94a6;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #667085;
    }

    @media (max-width: 900px) {
      .product-form {
        grid-template-columns: 1fr 1fr;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
      }

      .save-btn {
        width: 100%;
      }
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .header {
        padding: 18px;
      }

      .header h1 {
        font-size: 19px;
      }

      .cards {
        padding: 12px;
        gap: 10px;
      }

      .card {
        padding: 14px;
      }

      .card .value {
        font-size: 19px;
      }

      .section {
        margin: 0 12px 15px;
        padding: 14px;
      }

      .product-form {
        grid-template-columns: 1fr;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .order-info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-top">
    <div>
      <h1>📊 Telegram Sales Manager V2</h1>
      <p>የሽያጭና ትዕዛዝ መቆጣጠሪያ</p>
    </div>

    <button class="refresh" onclick="refreshAll()">
      🔄 Refresh
    </button>
  </div>
</header>


<!-- STATS -->

<section class="cards">

  <div class="card">
    <div class="icon">📦</div>
    <div class="label">ጠቅላላ ትዕዛዞች</div>
    <div class="value" id="totalOrders">0</div>
  </div>

  <div class="card">
    <div class="icon">🟡</div>
    <div class="label">Pending</div>
    <div class="value" id="pendingOrders">0</div>
  </div>

  <div class="card">
    <div class="icon">💰</div>
    <div class="label">ጠቅላላ ሽያጭ</div>
    <div class="value" id="totalSales">0 ETB</div>
  </div>

  <div class="card">
    <div class="icon">📈</div>
    <div class="label">ጠቅላላ ትርፍ</div>
    <div class="value" id="totalProfit">0 ETB</div>
  </div>

</section>


<!-- ADD PRODUCT -->

<section class="section">

  <div class="section-header">
    <h2>➕ አዲስ ምርት ጨምር</h2>
  </div>

  <form id="productForm" class="product-form">

    <div class="field">
      <label>የምርት ስም</label>
      <input
        id="productName"
        type="text"
        placeholder="ምሳሌ፦ ሸሚዝ"
        required
      >
    </div>

    <div class="field">
      <label>የተገዛበት</label>
      <input
        id="buyPrice"
        type="number"
        min="0"
        step="0.01"
        placeholder="500"
        required
      >
    </div>

    <div class="field">
      <label>የሽያጭ ዋጋ</label>
      <input
        id="sellPrice"
        type="number"
        min="0"
        step="0.01"
        placeholder="800"
        required
      >
    </div>

    <div class="field">
      <label>ብዛት</label>
      <input
        id="stock"
        type="number"
        min="0"
        step="1"
        placeholder="10"
        required
      >
    </div>

    <button id="saveProductBtn" class="save-btn" type="submit">
      💾 Save
    </button>

  </form>

  <div id="productMessage" class="message"></div>

</section>


<!-- PRODUCTS -->

<section class="section">

  <div class="section-header">
    <h2>🛍️ የምርት ዝርዝር</h2>
    <div class="status" id="productsUpdated">-</div>
  </div>

  <div id="products" class="products">
    <div class="loading">
      ምርቶች በመጫን ላይ...
    </div>
  </div>

</section>


<!-- ORDERS -->

<section class="section">

  <div class="section-header">
    <h2>🛒 የቅርብ ጊዜ ትዕዛዞች</h2>

    <div class="status" id="lastUpdated">
      -
    </div>
  </div>

  <div id="orders" class="orders">
    <div class="loading">
      ትዕዛዞች በመጫን ላይ...
    </div>
  </div>

</section>


<script>

const PRODUCTS_API = "/api/products";
const ORDERS_API = "/api/orders";


/* =========================
   ADD PRODUCT
========================= */

document
  .getElementById("productForm")
  .addEventListener("submit", addProduct);


async function addProduct(event) {

  event.preventDefault();

  const button =
    document.getElementById("saveProductBtn");

  const message =
    document.getElementById("productMessage");

  const name =
    document.getElementById("productName")
      .value
      .trim();

  const buyPrice =
    Number(document.getElementById("buyPrice").value);

  const sellPrice =
    Number(document.getElementById("sellPrice").value);

  const stock =
    Number(document.getElementById("stock").value);


  if (!name) {
    showMessage("❌ የምርት ስም ያስገቡ።", "error");
    return;
  }

  if (!Number.isFinite(buyPrice) || buyPrice < 0) {
    showMessage("❌ የተገዛበት ዋጋ ትክክል አይደለም።", "error");
    return;
  }

  if (!Number.isFinite(sellPrice) || sellPrice < 0) {
    showMessage("❌ የሽያጭ ዋጋ ትክክል አይደለም።", "error");
    return;
  }

  if (!Number.isFinite(stock) || stock < 0) {
    showMessage("❌ ብዛቱ ትክክል አይደለም።", "error");
    return;
  }


  button.disabled = true;
  button.textContent = "⏳ Saving...";


  try {

    const response = await fetch(PRODUCTS_API, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        name,
        buyPrice,
        sellPrice,
        stock
      })

    });


    const data = await response.json();


    if (!response.ok || !data.ok) {

      throw new Error(
        data.error || "Product could not be saved"
      );

    }


    showMessage(
      "✅ ምርቱ በትክክል ተቀምጧል። Telegram Bot ላይም ይታያል።",
      "success"
    );


    document
      .getElementById("productForm")
      .reset();


    await loadProducts();


  } catch (error) {

    console.error("ADD PRODUCT ERROR:", error);

    showMessage(
      "❌ ምርቱ መቀመጥ አልቻለም። " +
      error.message,
      "error"
    );

  } finally {

    button.disabled = false;
    button.textContent = "💾 Save";

  }
}


function showMessage(text, type) {

  const message =
    document.getElementById("productMessage");

  message.textContent = text;

  message.className =
    "message " + type;

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  const container =
    document.getElementById("products");

  container.innerHTML =
    `<div class="loading">⏳ ምርቶች በመጫን ላይ...</div>`;


  try {

    const response =
      await fetch(PRODUCTS_API);


    if (!response.ok) {
      throw new Error("Products API error");
    }


    const data =
      await response.json();


    const products =
      Array.isArray(data)
        ? data
        : (data.products || []);


    renderProducts(products);


    document.getElementById("productsUpdated")
      .textContent =
      "የተዘመነው፦ " +
      new Date().toLocaleTimeString("am-ET");


  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        ❌ ምርቶችን ማግኘት አልተቻለም።
      </div>`;

  }
}


function renderProducts(products) {

  const container =
    document.getElementById("products");


  if (!products.length) {

    container.innerHTML =
      `<div class="empty">
        📭 እስካሁን ምንም ምርት የለም።
      </div>`;

    return;
  }


  container.innerHTML =
    products.map(product => {

      const buy =
        Number(product.buyPrice || 0);

      const sell =
        Number(product.sellPrice || 0);

      const stock =
        Number(product.stock || 0);

      const profit =
        sell - buy;


      return `
        <div class="product">

          <div class="product-name">
            🛍️ ${escapeHtml(product.name)}
          </div>

          <div class="product-info">

            <div>
              <span>የተገዛበት</span>
              ${formatMoney(buy)} ETB
            </div>

            <div>
              <span>የሽያጭ ዋጋ</span>
              ${formatMoney(sell)} ETB
            </div>

            <div>
              <span>ትርፍ / አንድ እቃ</span>
              ${formatMoney(profit)} ETB
            </div>

            <div>
              <span>በክምችት</span>
              ${stock}
            </div>

          </div>

        </div>
      `;

    }).join("");
}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders() {

  const container =
    document.getElementById("orders");


  try {

    const response =
      await fetch(ORDERS_API);


    if (!response.ok) {
      throw new Error("Orders API error");
    }


    const data =
      await response.json();


    const orders =
      Array.isArray(data)
        ? data
        : (data.orders || []);


    updateStats(orders);
    renderOrders(orders);


    document.getElementById("lastUpdated")
      .textContent =
      "የመጨረሻ ማዘመኛ፦ " +
      new Date().toLocaleTimeString("am-ET");


  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        ❌ ትዕዛዞችን ማግኘት አልተቻለም።
      </div>`;

  }
}


/* =========================
   STATS
========================= */

function updateStats(orders) {

  document.getElementById("totalOrders")
    .textContent = orders.length;


  const pending =
    orders.filter(order => {

      const status =
        String(order.status || "")
          .toUpperCase();

      return (
        status === "PENDING" ||
        status === "PENDING_PAYMENT"
      );

    }).length;


  document.getElementById("pendingOrders")
    .textContent = pending;


  let sales = 0;
  let profit = 0;


  orders.forEach(order => {

    const quantity =
      Number(order.quantity || 1);

    const total =
      Number(
        order.total ??
        (
          Number(order.sellPrice || 0) *
          quantity
        )
      );


    const buyPrice =
      Number(order.buyPrice || 0);


    sales += total;

    profit +=
      (
        Number(order.sellPrice || 0) -
        buyPrice
      ) * quantity;

  });


  document.getElementById("totalSales")
    .textContent =
    formatMoney(sales) + " ETB";


  document.getElementById("totalProfit")
    .textContent =
    formatMoney(profit) + " ETB";
}


/* =========================
   RENDER ORDERS
========================= */

function renderOrders(orders) {

  const container =
    document.getElementById("orders");


  if (!orders.length) {

    container.innerHTML =
      `<div class="empty">
        📭 እስካሁን ምንም ትዕዛዝ የለም።
      </div>`;

    return;
  }


  const sorted =
    [...orders].reverse();


  container.innerHTML =
    sorted.map((order, index) => {

      const status =
        String(order.status || "PENDING")
          .toUpperCase();


      let statusClass = "pending";
      let statusText = "Pending";


      if (status === "CONFIRMED") {
        statusClass = "confirmed";
        statusText = "Confirmed";
      }

      if (status === "CANCELLED") {
        statusClass = "cancelled";
        statusText = "Cancelled";
      }

      if (status === "PAYMENT_REJECTED") {
        statusClass = "rejected";
        statusText = "Payment Rejected";
      }

      if (status === "PENDING_PAYMENT") {
        statusClass = "pending";
        statusText = "Payment በመጠባበቅ ላይ";
      }


      const quantity =
        Number(order.quantity || 1);


      const sellPrice =
        Number(order.sellPrice || 0);


      const buyPrice =
        Number(order.buyPrice || 0);


      const total =
        Number(
          order.total ??
          sellPrice * quantity
        );


      const profit =
        (sellPrice - buyPrice) * quantity;


      const product =
        order.productName ||
        order.name ||
        "ያልታወቀ እቃ";


      const customer =
        order.customerName ||
        order.username ||
        "ያልታወቀ";


      const telegram =
        order.username
          ? "@" +
            String(order.username)
              .replace("@", "")
          : "-";


      const orderId =
        order.id ||
        ("ORDER-" + (index + 1));


      return `

        <div class="order">

          <div class="order-top">

            <div class="order-id">
              #${escapeHtml(orderId)}
            </div>

            <div class="badge ${statusClass}">
              ${statusText}
            </div>

          </div>


          <div class="order-info">

            <div class="info">
              <span>👤 ደንበኛ</span>
              ${escapeHtml(customer)}
            </div>

            <div class="info">
              <span>📱 Telegram</span>
              ${escapeHtml(telegram)}
            </div>

            <div class="info">
              <span>🛍️ እቃ</span>
              ${escapeHtml(product)}
            </div>

            <div class="info">
              <span>🔢 ብዛት</span>
              ${quantity}
            </div>

            <div class="info">
              <span>💰 የሽያጭ ዋጋ</span>
              ${formatMoney(sellPrice)} ETB
            </div>

            <div class="info">
              <span>💵 የተገዛበት</span>
              ${formatMoney(buyPrice)} ETB
            </div>

            <div class="info">
              <span>🧾 ጠቅላላ</span>
              ${formatMoney(total)} ETB
            </div>

            <div class="info">
              <span>📈 ትርፍ</span>
              <strong class="profit">
                ${formatMoney(profit)} ETB
              </strong>
            </div>

          </div>

        </div>

      `;

    }).join("");
}


/* =========================
   HELPERS
========================= */

function formatMoney(number) {

  return Number(number || 0)
    .toLocaleString("en-US", {
      maximumFractionDigits: 2
    });
}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   REFRESH
========================= */

async function refreshAll() {

  await Promise.all([
    loadProducts(),
    loadOrders()
  ]);

}


/* =========================
   AUTO REFRESH
========================= */

setInterval(refreshAll, 15000);


/* =========================
   INITIAL LOAD
========================= */

refreshAll();

</script>

</body>
</html>
