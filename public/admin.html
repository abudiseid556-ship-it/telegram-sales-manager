<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1477ff">
<title>Telegram Sales Manager</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#1477ff;
  --blue2:#655cff;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#7b8496;
  --line:#e7ebf2;
  --green:#16a66a;
  --red:#ef4d5d;
  --orange:#ff9f43;
  --shadow:0 10px 30px rgba(35,64,110,.08);
}
body{
  margin:0;
  font-family:Arial,"Noto Sans Ethiopic",sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

/* LOGIN */
.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:linear-gradient(145deg,#1477ff,#655cff);
}
.login-card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:28px;
  padding:30px 22px;
  box-shadow:0 25px 70px rgba(0,0,0,.18);
}
.logo{
  width:76px;height:76px;border-radius:24px;
  margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:34px;font-weight:900;
  background:linear-gradient(135deg,#1477ff,#655cff);
}
.login-card h1{text-align:center;margin:0;font-size:25px}
.login-card p{text-align:center;color:var(--muted);margin:8px 0 24px}
.field{margin-bottom:14px}
.field label{
  display:block;font-size:13px;font-weight:700;margin-bottom:7px;
}
.field input,.field select,.field textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px 14px;
  outline:none;
  background:#fff;
}
.field textarea{min-height:100px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--blue);
}
.primary{
  width:100%;
  padding:14px;
  border-radius:15px;
  color:#fff;
  font-weight:800;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
}
.error{
  color:var(--red);
  text-align:center;
  font-size:13px;
  margin-top:12px;
}

/* APP */
.app{min-height:100vh;padding-bottom:84px}
.top{
  padding:24px 18px 72px;
  color:#fff;
  background:linear-gradient(135deg,#1477ff,#655cff);
  border-radius:0 0 32px 32px;
}
.top-row{
  display:flex;justify-content:space-between;align-items:center;
}
.brand small{opacity:.85}
.brand h2{margin:4px 0 0;font-size:22px}
.logout{
  background:rgba(255,255,255,.18);
  color:#fff;
  padding:9px 12px;
  border-radius:12px;
}
.stats{
  margin:-48px 16px 18px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.stat{
  background:#fff;
  padding:16px;
  border-radius:20px;
  box-shadow:var(--shadow);
}
.stat .icon{font-size:22px}
.stat .label{font-size:12px;color:var(--muted);margin-top:8px}
.stat .value{font-size:20px;font-weight:900;margin-top:4px}
.content{padding:0 16px}
.section{display:none}
.section.active{display:block}
.section-title{
  display:flex;justify-content:space-between;align-items:center;
  margin:18px 2px 12px;
}
.section-title h3{margin:0;font-size:19px}
.add-btn{
  background:var(--blue);
  color:#fff;
  padding:9px 13px;
  border-radius:12px;
  font-weight:700;
}

/* CARDS */
.card{
  background:#fff;
  border-radius:20px;
  padding:16px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
}
.product-card{
  display:flex;gap:13px;align-items:center;
}
.product-photo{
  width:70px;height:70px;
  border-radius:16px;
  object-fit:cover;
  background:#eef2f7;
  flex:none;
}
.product-info{min-width:0;flex:1}
.product-info h4{
  margin:0 0 5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.muted{color:var(--muted);font-size:13px}
.price{font-weight:800;margin-top:5px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.small-btn{
  padding:8px 10px;
  border-radius:10px;
  background:#eef4ff;
  color:var(--blue);
  font-size:12px;
  font-weight:700;
}
.small-btn.red{background:#fff0f1;color:var(--red)}
.small-btn.green{background:#eafaf3;color:var(--green)}
.small-btn.orange{background:#fff5e9;color:#d87900}

.empty{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
}

/* ORDERS */
.order-card h4{margin:0 0 7px}
.order-row{
  display:flex;justify-content:space-between;
  gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}
.order-row:last-child{border-bottom:0}
.badge{
  display:inline-flex;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
}
.badge.new{background:#edf4ff;color:#1477ff}
.badge.pending{background:#fff6e9;color:#d87900}
.badge.confirmed{background:#eafaf3;color:#15925e}
.badge.rejected{background:#fff0f1;color:#df394b}
.badge.delivery{background:#f1edff;color:#655cff}

/* QUICK */
.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.quick{
  padding:18px;
  background:#fff;
  border-radius:20px;
  box-shadow:var(--shadow);
  text-align:left;
}
.quick-icon{font-size:26px}
.quick b{display:block;margin-top:8px}
.quick span{font-size:12px;color:var(--muted)}

/* MODAL */
.modal-wrap{
  position:fixed;inset:0;
  background:rgba(8,20,40,.52);
  z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal{
  width:100%;max-width:560px;
  max-height:92vh;overflow:auto;
  background:#fff;
  border-radius:28px 28px 0 0;
  padding:20px;
}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:15px;
}
.modal-head h3{margin:0}
.close{
  width:36px;height:36px;border-radius:50%;
  background:#f0f3f7;font-size:20px;
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
@media(max-width:480px){
  .form-grid{grid-template-columns:1fr}
  .form-grid .full{grid-column:auto}
}

/* PHOTO */
.photo-buttons{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.photo-btn{
  padding:13px;
  border-radius:14px;
  background:#eef4ff;
  color:var(--blue);
  font-weight:800;
}
.photo-preview{
  margin-top:12px;
  position:relative;
  display:none;
}
.photo-preview img{
  width:100%;max-height:220px;
  object-fit:cover;border-radius:16px;
}
.remove-photo{
  position:absolute;right:8px;top:8px;
  width:34px;height:34px;border-radius:50%;
  background:#fff;color:var(--red);
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

/* NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:72px;background:#fff;
  border-top:1px solid var(--line);
  display:flex;z-index:90;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1;background:none;color:#8b94a5;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:4px;font-size:10px;font-weight:700;
}
.nav-btn span:first-child{font-size:20px}
.nav-btn.active{color:var(--blue)}

/* CHECKBOX */
.check-list{
  display:grid;gap:9px;
}
.check-item{
  display:flex;align-items:center;gap:9px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:13px;
}
.check-item input{accent-color:var(--blue)}

/* REPORT */
.report-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.report-box{
  background:#fff;border-radius:18px;padding:16px;
  box-shadow:var(--shadow);
}
.report-box b{display:block;font-size:19px;margin-top:5px}

/* TOAST */
.toast{
  position:fixed;
  left:50%;bottom:88px;
  transform:translateX(-50%) translateY(20px);
  background:#172033;color:#fff;
  padding:12px 17px;border-radius:13px;
  font-size:13px;z-index:300;
  opacity:0;pointer-events:none;
  transition:.25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="logo">🛒</div>
    <h1>UNI MARKET</h1>
    <p>Telegram Sales Manager</p>

    <div class="field">
      <label>የተጠቃሚ ስም</label>
      <input id="loginUsername" autocomplete="username" placeholder="admin">
    </div>

    <div class="field">
      <label>የይለፍ ቃል</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>

    <button class="primary" onclick="login()">ግባ</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

  <header class="top">
    <div class="top-row">
      <div class="brand">
        <small>Telegram Sales Manager</small>
        <h2>UNI MARKET 🛍️</h2>
      </div>
      <button class="logout" onclick="logout()">ውጣ</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="icon">💰</div>
      <div class="label">የዛሬ ሽያጭ</div>
      <div class="value" id="statSales">0</div>
    </div>
    <div class="stat">
      <div class="icon">📈</div>
      <div class="label">ትርፍ</div>
      <div class="value" id="statProfit">0</div>
    </div>
    <div class="stat">
      <div class="icon">📦</div>
      <div class="label">Orders</div>
      <div class="value" id="statOrders">0</div>
    </div>
    <div class="stat">
      <div class="icon">🛒</div>
      <div class="label">Stock</div>
      <div class="value" id="statStock">0</div>
    </div>
  </div>

  <main class="content">

    <!-- HOME -->
    <section id="home" class="section active">
      <div class="section-title">
        <h3>ዋና ገጽ</h3>
      </div>

      <div class="quick-grid">
        <button class="quick" onclick="showSection('products');openProductModal()">
          <div class="quick-icon">➕</div>
          <b>ፕሮዳክት ጨምር</b>
          <span>አዲስ ምርት መመዝገብ</span>
        </button>

        <button class="quick" onclick="showSection('orders')">
          <div class="quick-icon">📦</div>
          <b>Orders</b>
          <span>የመጡ ትዕዛዞች</span>
        </button>

        <button class="quick" onclick="showSection('ads');openAdModal()">
          <div class="quick-icon">📢</div>
          <b>ማስታወቂያ</b>
          <span>ወደ Telegram ላክ</span>
        </button>

        <button class="quick" onclick="showSection('reports')">
          <div class="quick-icon">📊</div>
          <b>ሪፖርት</b>
          <span>ሽያጭና ትርፍ</span>
        </button>
      </div>

      <div class="section-title">
        <h3>አዲስ Orders</h3>
        <button class="small-btn" onclick="showSection('orders')">ሁሉን እይ</button>
      </div>
      <div id="homeOrders"></div>
    </section>

    <!-- PRODUCTS -->
    <section id="products" class="section">
      <div class="section-title">
        <h3>ፕሮዳክቶች</h3>
        <button class="add-btn" onclick="openProductModal()">＋ ጨምር</button>
      </div>
      <div id="productsList"></div>
    </section>

    <!-- ORDERS -->
    <section id="orders" class="section">
      <div class="section-title">
        <h3>Orders</h3>
        <button class="small-btn" onclick="loadOrders()">↻</button>
      </div>
      <div id="ordersList"></div>
    </section>

    <!-- ADS -->
    <section id="ads" class="section">
      <div class="section-title">
        <h3>ማስታወቂያ</h3>
        <button class="add-btn" onclick="openAdModal()">＋ ፍጠር</button>
      </div>
      <div id="adsList"></div>
    </section>

    <!-- EMPLOYEES -->
    <section id="employees" class="section">
      <div class="section-title">
        <h3>ሰራተኞች</h3>
        <button class="add-btn" onclick="openEmployeeModal()">＋ ጨምር</button>
      </div>
      <div id="employeesList"></div>
    </section>

    <!-- REPORTS -->
    <section id="reports" class="section">
      <div class="section-title">
        <h3>ሪፖርቶች</h3>
        <button class="small-btn" onclick="loadReports()">↻</button>
      </div>
      <div id="reportsList"></div>
    </section>

    <!-- SETTINGS -->
    <section id="settings" class="section">
      <div class="section-title">
        <h3>Settings</h3>
      </div>

      <div class="card">
        <h4>💳 Payment Settings</h4>

        <div class="field">
          <label>የክፍያ መረጃ</label>
          <textarea id="paymentInfo" placeholder="የባንክ / Telebirr / ሌሎች የክፍያ መረጃ"></textarea>
        </div>

        <button class="primary" onclick="savePaymentSettings()">አስቀምጥ</button>
      </div>

      <div class="card">
        <h4>📢 Telegram Channels / Groups</h4>
        <button class="primary" onclick="openChannelModal()">＋ Channel / Group ጨምር</button>
        <div id="channelsList" style="margin-top:12px"></div>
      </div>
    </section>

  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-section="home" onclick="showSection('home')">
      <span>🏠</span><span>Home</span>
    </button>
    <button class="nav-btn" data-section="products" onclick="showSection('products')">
      <span>🛍️</span><span>Products</span>
    </button>
    <button class="nav-btn" data-section="orders" onclick="showSection('orders')">
      <span>📦</span><span>Orders</span>
    </button>
    <button class="nav-btn" data-section="ads" onclick="showSection('ads')">
      <span>📢</span><span>Ads</span>
    </button>
    <button class="nav-btn" data-section="settings" onclick="showSection('settings')">
      <span>⚙️</span><span>More</span>
    </button>
  </nav>
</div>

<!-- PRODUCT MODAL -->
<div id="productModal" class="modal-wrap hidden" onclick="backdropClose(event,'productModal')">
  <div class="modal">
    <div class="modal-head">
      <h3 id="productModalTitle">አዲስ ፕሮዳክት</h3>
      <button class="close" onclick="closeModal('productModal')">×</button>
    </div>

    <form id="productForm">
      <input type="hidden" id="productId">

      <div class="form-grid">
        <div class="field">
          <label>የፕሮዳክት ስም *</label>
          <input id="pName" required>
        </div>

        <div class="field">
          <label>Category</label>
          <select id="pCategory">
            <option value="clothing">👕 አልባሳት</option>
            <option value="electronics">📱 ኤሌክትሮኒክስ</option>
            <option value="kids">🧒 የህፃናት</option>
            <option value="women">👩 የሴቶች</option>
            <option value="home">🏠 የቤት እቃዎች</option>
            <option value="other">🛍️ ሌሎች</option>
          </select>
        </div>

        <div class="field">
          <label>የግዢ ዋጋ</label>
          <input id="pBuy" type="number" min="0">
        </div>

        <div class="field">
          <label>የሽያጭ ዋጋ *</label>
          <input id="pSell" type="number" min="0" required>
        </div>

        <div class="field">
          <label>Stock *</label>
          <input id="pStock" type="number" min="0" required>
        </div>

        <div class="field full">
          <label>ፎቶ</label>

          <div class="photo-buttons">
            <button type="button" class="photo-btn" onclick="openGallery('productGallery')">🖼️ Gallery</button>
            <button type="button" class="photo-btn" onclick="openCamera('productCamera')">📷 Camera</button>
          </div>

          <input id="productGallery" type="file" accept="image/*" hidden onchange="handlePhotoSelect(this,'product')">
          <input id="productCamera" type="file" accept="image/*" capture="environment" hidden onchange="handlePhotoSelect(this,'product')">

          <input type="hidden" id="pPhoto">

          <div id="productPhotoPreview" class="photo-preview">
            <img id="productPreviewImg">
            <button type="button" class="remove-photo" onclick="removePhoto('product')">×</button>
          </div>
        </div>

        <div class="field full">
          <label>Description</label>
          <textarea id="pDescription" placeholder="የፕሮዳክቱ መግለጫ"></textarea>
        </div>
      </div>

      <button class="primary" type="submit">💾 አስቀምጥ</button>
    </form>
  </div>
</div>

<!-- AD MODAL -->
<div id="adModal" class="modal-wrap hidden" onclick="backdropClose(event,'adModal')">
  <div class="modal">
    <div class="modal-head">
      <h3>📢 ማስታወቂያ ፍጠር</h3>
      <button class="close" onclick="closeModal('adModal')">×</button>
    </div>

    <form id="adForm">

      <div class="field">
        <label>የማስታወቂያ አይነት</label>
        <select id="adType" onchange="updateAdTemplate()">
          <option value="product">🛍️ Product</option>
          <option value="custom">✍️ Custom</option>
        </select>
      </div>

      <div id="adProductBox" class="field">
        <label>Product</label>
        <select id="adProduct"></select>
      </div>

      <div class="field">
        <label>Title *</label>
        <input id="adTitle" required>
      </div>

      <div class="field">
        <label>Text</label>
        <textarea id="adText"></textarea>
      </div>

      <div class="field">
        <label>Button Text</label>
        <input id="adButtonText" value="🛒 አሁን ይዘዙ">
      </div>

      <div class="field">
        <label>የማስታወቂያ ፎቶ</label>

        <div class="photo-buttons">
          <button type="button" class="photo-btn" onclick="openGallery('adGallery')">🖼️ Gallery</button>
          <button type="button" class="photo-btn" onclick="openCamera('adCamera')">📷 Camera</button>
        </div>

        <input id="adGallery" type="file" accept="image/*" hidden onchange="handlePhotoSelect(this,'ad')">
        <input id="adCamera" type="file" accept="image/*" capture="environment" hidden onchange="handlePhotoSelect(this,'ad')">

        <input type="hidden" id="adPhoto">

        <div id="adPhotoPreview" class="photo-preview">
          <img id="adPreviewImg">
          <button type="button" class="remove-photo" onclick="removePhoto('ad')">×</button>
        </div>
      </div>

      <div class="field">
        <label>የሚላክበት Channel / Group</label>
        <div id="adChannels" class="check-list"></div>
      </div>

      <button class="primary" type="submit">📢 አስቀምጥ</button>
    </form>
  </div>
</div>

<!-- CHANNEL MODAL -->
<div id="channelModal" class="modal-wrap hidden" onclick="backdropClose(event,'channelModal')">
  <div class="modal">
    <div class="modal-head">
      <h3>📢 Channel / Group</h3>
      <button class="close" onclick="closeModal('channelModal')">×</button>
    </div>

    <form id="channelForm">
      <input type="hidden" id="channelId">

      <div class="field">
        <label>Name *</label>
        <input id="channelName" required placeholder="UNI MARKET Channel">
      </div>

      <div class="field">
        <label>Chat ID *</label>
        <input id="channelChatId" required placeholder="-1001234567890">
      </div>

      <div class="field">
        <label>Username</label>
        <input id="channelUsername" placeholder="@uni_market">
      </div>

      <div class="field">
        <label>Type</label>
        <select id="channelType">
          <option value="channel">Channel</option>
          <option value="group">Group</option>
        </select>
      </div>

      <button type="button" class="small-btn" onclick="checkTelegramChat()">🔎 Telegram ላይ ፈትሽ</button>
      <div id="telegramCheckResult" class="muted" style="margin:10px 0"></div>

      <button class="primary" type="submit">💾 አስቀምጥ</button>
    </form>
  </div>

<div id="toast" class="toast"></div>

<script>
"use strict";

/* =========================
   API
========================= */

const API = {
  auth:"/api/auth",
  products:"/api/products",
  orders:"/api/orders",
  ads:"/api/advertisements",
  employees:"/api/employees",
  reports:"/api/reports",
  payment:"/api/payment-settings",
  telegram:"/api/telegram-settings",
  channels:"/api/telegram-channels",
  telegramCheck:"/api/telegram/check-chat",

  /*
    IMPORTANT:
    server.js uses /api/upload
    NOT /api/upload-image
  */
  upload:"/api/upload"
};

let token = localStorage.getItem("uni_market_token") || "";
let currentUser = null;
let products = [];
let orders = [];
let advertisements = [];
let channels = [];
let employees = [];
let editingProductId = null;

/* =========================
   HELPERS
========================= */

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>el.classList.remove("show"),2500);
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function money(value){
  const n=Number(value||0);
  return n.toLocaleString("en-US")+" ETB";
}

async function api(url,options={}){
  const headers={
    ...(options.headers||{})
  };

  if(token){
    headers.Authorization="Bearer "+token;
  }

  if(options.body && !(options.body instanceof FormData)){
    headers["Content-Type"]="application/json";
  }

  const response=await fetch(url,{
    ...options,
    headers
  });

  const text=await response.text();

  let data;
  try{
    data=text?JSON.parse(text):{};
  }catch{
    data={message:text};
  }

  if(!response.ok){
    throw new Error(data.error || data.message || `API Error ${response.status}`);
  }

  return data;
}

/* =========================
   LOGIN
========================= */

async function login(){
  const username=document.getElementById("loginUsername").value.trim();
  const password=document.getElementById("loginPassword").value;

  document.getElementById("loginError").textContent="";

  if(!username || !password){
    document.getElementById("loginError").textContent="Username እና Password ያስገቡ";
    return;
  }

  try{
    const result=await api(API.auth+"/login",{
      method:"POST",
      body:JSON.stringify({
        username,
        password
      })
    });

    token=result.token || result.access_token || result.auth_token || "";

    if(!token){
      throw new Error("Login token አልተመለሰም");
    }

    localStorage.setItem("uni_market_token",token);

    currentUser=result.user || result;
    showApp();
    await refreshAll();

  }catch(error){
    document.getElementById("loginError").textContent=error.message;
  }
}

async function checkLogin(){
  if(!token){
    showLogin();
    return;
  }

  try{
    const result=await api(API.auth+"/me");
    currentUser=result.user || result;
    showApp();
    await refreshAll();
  }catch{
    logout(false);
  }
}

function showLogin(){
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
}

function showApp(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
}

function logout(show=true){
  token="";
  currentUser=null;
  localStorage.removeItem("uni_market_token");
  showLogin();
  if(show) toast("ወጥተዋል");
}

/* =========================
   NAVIGATION
========================= */

function showSection(name){
  document.querySelectorAll(".section").forEach(s=>{
    s.classList.toggle("active",s.id===name);
  });

  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.section===name
    );
  });

  if(name==="products") loadProducts();
  if(name==="orders") loadOrders();
  if(name==="ads") loadAdvertisements();
  if(name==="employees") loadEmployees();
  if(name==="reports") loadReports();
  if(name==="settings"){
    loadChannels();
    loadPaymentSettings();
  }

  window.scrollTo({top:0,behavior:"smooth"});
}

/* =========================
   PRODUCTS
========================= */

function mapProduct(p){
  return {
    id:p.id,
    name:p.name || p.title || "",
    category:p.category || "",
    buy_price:Number(p.buy_price ?? p.buyPrice ?? 0),
    sell_price:Number(p.sell_price ?? p.sellPrice ?? p.price ?? 0),
    stock:Number(p.stock ?? p.quantity ?? 0),
    photo_url:p.photo_url || p.photoUrl || p.photo || "",
    description:p.description || ""
  };
}

async function loadProducts(){
  try{
    const result=await api(API.products);

    const list=Array.isArray(result)
      ? result
      : result.products || result.data || [];

    products=list.map(mapProduct);
    renderProducts();
    updateStats();

  }catch(error){
    document.getElementById("productsList").innerHTML=
      `<div class="card empty">❌ ${escapeHtml(error.message)}</div>`;
  }
}

function renderProducts(){
  const el=document.getElementById("productsList");

  if(!products.length){
    el.innerHTML=`<div class="card empty">📦 ምንም ፕሮዳክት የለም</div>`;
    return;
  }

  el.innerHTML=products.map(p=>`
    <div class="card product-card">
      <img
        class="product-photo"
        src="${escapeHtml(p.photo_url || "https://via.placeholder.com/150?text=UNI")}"
        onerror="this.src='https://via.placeholder.com/150?text=UNI'"
      >

      <div class="product-info">
        <h4>${escapeHtml(p.name)}</h4>
        <div class="muted">${escapeHtml(p.category || "ሌሎች")}</div>
        <div class="price">${money(p.sell_price)}</div>
        <div class="muted">Stock: ${p.stock}</div>

        <div class="actions">
          <button class="small-btn" onclick="editProduct('${escapeHtml(p.id)}')">✏️ Edit</button>
          <button class="small-btn red" onclick="deleteProduct('${escapeHtml(p.id)}')">🗑️ Delete</button>
        </div>
      </div>
    </div>
  `).join("");
}

function openProductModal(product=null){
  editingProductId=product?.id || null;

  document.getElementById("productModalTitle").textContent=
    product ? "ፕሮዳክት አስተካክል" : "አዲስ ፕሮዳክት";

  document.getElementById("productId").value=product?.id || "";
  document.getElementById("pName").value=product?.name || "";
  document.getElementById("pCategory").value=product?.category || "other";
  document.getElementById("pBuy").value=product?.buy_price ?? "";
  document.getElementById("pSell").value=product?.sell_price ?? "";
  document.getElementById("pStock").value=product?.stock ?? "";
  document.getElementById("pDescription").value=product?.description || "";
  document.getElementById("pPhoto").value=product?.photo_url || "";

  if(product?.photo_url){
    showPhotoPreview(product.photo_url,"product");
  }else{
    removePhoto("product");
  }

  document.getElementById("productModal").classList.remove("hidden");
}

function editProduct(id){
  const p=products.find(x=>String(x.id)===String(id));
  if(p) openProductModal(p);
}

async function deleteProduct(id){
  if(!confirm("ይህን ፕሮዳክት መሰረዝ ይፈልጋሉ?")) return;

  try{
    await api(API.products+"/"+encodeURIComponent(id),{
      method:"DELETE"
    });

    toast("ፕሮዳክቱ ተሰርዟል");
    await loadProducts();

  }catch(error){
    toast("❌ "+error.message);
  }
}

document.getElementById("productForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const payload={
    name:document.getElementById("pName").value.trim(),
    category:document.getElementById("pCategory").value,
    buy_price:Number(document.getElementById("pBuy").value||0),
    sell_price:Number(document.getElementById("pSell").value||0),
    stock:Number(document.getElementById("pStock").value||0),
    photo_url:document.getElementById("pPhoto").value.trim(),
    description:document.getElementById("pDescription").value.trim()
  };

  try{
    if(editingProductId){
      await api(API.products+"/"+encodeURIComponent(editingProductId),{
        method:"PATCH",
        body:JSON.stringify(payload)
      });
      toast("ፕሮዳክቱ ተስተካክሏል");
    }else{
      await api(API.products,{
        method:"POST",
        body:JSON.stringify(payload)
      });
      toast("አዲስ ፕሮዳክት ተጨምሯል");
    }

    closeModal("productModal");
    e.target.reset();
    editingProductId=null;
    await loadProducts();

  }catch(error){
    toast("❌ "+error.message);
  }
});

/* =========================
   PHOTO UPLOAD
========================= */

function openGallery(inputId){
  document.getElementById(inputId).click();
}

function openCamera(inputId){
  document.getElementById(inputId).click();
}

function handlePhotoSelect(input,type){
  const file=input.files?.[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    toast("❌ እባክዎ image ይምረጡ");
    return;
  }

  if(file.size>8*1024*1024){
    toast("❌ ፎቶው ከ8MB መብለጥ የለበትም");
    return;
  }

  const reader=new FileReader();

  reader.onload=()=>{
    showPhotoPreview(reader.result,type);
  };

  reader.readAsDataURL(file);

  /*
    Keep the file temporarily.
    Upload happens when the form is submitted.
  */
  if(type==="product"){
    window.selectedProductPhoto=file;
  }else{
    window.selectedAdPhoto=file;
  }
}

function showPhotoPreview(url,type){
  const wrap=document.getElementById(
    type==="product" ? "productPhotoPreview" : "adPhotoPreview"
  );

  const img=document.getElementById(
    type==="product" ? "productPreviewImg" : "adPreviewImg"
  );

  img.src=url;
  wrap.style.display="block";

  if(type==="product"){
    document.getElementById("pPhoto").value=url;
  }else{
    document.getElementById("adPhoto").value=url;
  }
}

function removePhoto(type){
  const wrap=document.getElementById(
    type==="product" ? "productPhotoPreview" : "adPhotoPreview"
  );

  const img=document.getElementById(
    type==="product" ? "productPreviewImg" : "adPreviewImg"
  );

  wrap.style.display="none";
  img.removeAttribute("src");

  if(type==="product"){
    document.getElementById("pPhoto").value="";
    window.selectedProductPhoto=null;
    document.getElementById("productGallery").value="";
    document.getElementById("productCamera").value="";
  }else{
    document.getElementById("adPhoto").value="";
    window.selectedAdPhoto=null;
    document.getElementById("adGallery").value="";
    document.getElementById("adCamera").value="";
  }
}

/*
  IMPORTANT:
  This function uses /api/upload,
  which matches server.js.
*/
async function uploadPhoto(file,folder="products"){
  if(!file) return "";

  const form=new FormData();
  form.append("image",file);
  form.append("folder",folder);

  const result=await api(API.upload,{
    method:"POST",
    body:form
  });

  return result.url ||
         result.publicUrl ||
         result.photo_url ||
         result.photoUrl ||
         result.path ||
         "";
}

/* =========================
   ORDERS
========================= */

function mapOrder(o){
  return {
    ...o,
    id:o.id,
    status:o.status || "NEW",
    customer_name:o.customer_name || o.customerName || o.name || "",
    username:o.username || o.telegram_username || "",
    phone:o.phone || o.phone_number || "",
    product_name:o.product_name || o.productName || o.products?.name || "",
    quantity:Number(o.quantity || 1),
    total:Number(o.total || o.total_amount || o.amount || 0),
    payment_status:o.payment_status || "",
    delivery_status:o.delivery_status || ""
  };
}

async function loadOrders(){
  try{
    const result=await api(API.orders);

    const list=Array.isArray(result)
      ? result
      : result.orders || result.data || [];

    orders=list.map(mapOrder);
    renderOrders();
    renderHomeOrders();
    updateStats();

  }catch(error){
    document.getElementById("ordersList").innerHTML=
      `<div class="card empty">❌ ${escapeHtml(error.message)}</div>`;
  }
}

function statusClass(status){
  const s=String(status||"").toUpperCase();

  if(s.includes("CONFIRM")) return "confirmed";
  if(s.includes("REJECT")) return "rejected";
  if(s.includes("DELIVERY")) return "delivery";
  if(s.includes("PENDING")) return "pending";

  return "new";
}

function renderOrders(){
  const el=document.getElementById("ordersList");

  if(!orders.length){
    el.innerHTML=`<div class="card empty">📦 ምንም Order የለም</div>`;
    return;
  }

  el.innerHTML=orders.map(o=>`
    <div class="card order-card">
      <div style="display:flex;justify-content:space-between;gap:10px">
        <div>
          <h4>🛒 ${escapeHtml(o.product_name || "Order")}</h4>
          <div class="muted">#${escapeHtml(o.id)}</div>
        </div>
        <span class="badge ${statusClass(o.status)}">
          ${escapeHtml(o.status)}
        </span>
      </div>

      <div class="order-row">
        <span>Customer</span>
        <b>${escapeHtml(o.customer_name || "-")}</b>
      </div>

      <div class="order-row">
        <span>Phone</span>
        <b>${escapeHtml(o.phone || "-")}</b>
      </div>

      <div class="order-row">
        <span>Quantity</span>
        <b>${o.quantity}</b>
      </div>

      <div class="order-row">
        <span>Total</span>
        <b>${money(o.total)}</b>
      </div>

      <div class="order-row">
        <span>Payment</span>
        <b>${escapeHtml(o.payment_status || "-")}</b>
      </div>

      <div class="actions">
        <button class="small-btn green" onclick="changeOrderStatus('${escapeHtml(o.id)}','CONFIRMED')">
          ✅ Confirm
        </button>

        <button class="small-btn red" onclick="changeOrderStatus('${escapeHtml(o.id)}','REJECTED')">
          ❌ Reject
        </button>

        <button class="small-btn orange" onclick="changeOrderStatus('${escapeHtml(o.id)}','DELIVERY_PENDING')">
          🚚 Delivery
        </button>
      </div>
    </div>
  `).join("");
}

function renderHomeOrders(){
  const el=document.getElementById("homeOrders");
  const latest=orders.slice(0,4);

  if(!latest.length){
    el.innerHTML=`<div class="card empty">ምንም አዲስ Order የለም</div>`;
    return;
  }

  el.innerHTML=latest.map(o=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:10px">
        <b>${escapeHtml(o.product_name || "Order")}</b>
        <span class="badge ${statusClass(o.status)}">${escapeHtml(o.status)}</span>
      </div>
      <div class="muted" style="margin-top:6px">
        ${escapeHtml(o.customer_name || "-")} · ${money(o.total)}
      </div>
    </div>
  `).join("");
}

async function changeOrderStatus(id,status){
  try{
    await api(API.orders+"/"+encodeURIComponent(id)+"/status",{
      method:"PATCH",
      body:JSON.stringify({status})
    });

    toast("Order status ተቀይሯል");
    await loadOrders();

  }catch(error){
    toast("❌ "+error.message);
  }
}

/* =========================
   ADS
========================= */

async function loadAdvertisements(){
  try{
    const result=await api(API.ads);

    advertisements=Array.isArray(result)
      ? result
      : result.advertisements || result.ads || result.data || [];

    renderAdvertisements();
    await fillAdProducts();

  }catch(error){
    document.getElementById("adsList").innerHTML=
      `<div class="card empty">❌ ${escapeHtml(error.message)}</div>`;
  }
}

function renderAdvertisements(){
  const el=document.getElementById("adsList");

  if(!advertisements.length){
    el.innerHTML=`<div class="card empty">📢 ምንም ማስታወቂያ የለም</div>`;
    return;
  }

  el.innerHTML=advertisements.map(ad=>`
    <div class="card">
      ${ad.photo_url ? `
        <img
          src="${escapeHtml(ad.photo_url)}"
          style="width:100%;max-height:220px;object-fit:cover;border-radius:16px;margin-bottom:12px"
        >
      `:""}

      <h4 style="margin:0 0 6px">${escapeHtml(ad.title || "Advertisement")}</h4>

      <div class="muted">${escapeHtml(ad.text || "")}</div>

      <div style="margin-top:9px">
        <span class="badge ${ad.status==="PUBLISHED"?"confirmed":"pending"}">
          ${escapeHtml(ad.status || "DRAFT")}
        </span>
      </div>

      <div class="actions">
        ${
          ad.status!=="PUBLISHED"
          ? `<button class="small-btn green" onclick="publishAdvertisement('${escapeHtml(ad.id)}')">📢 Publish</button>`
          : ""
        }

        <button class="small-btn red" onclick="deleteAdvertisement('${escapeHtml(ad.id)}')">
          🗑️ Delete
        </button>
      </div>
    </div>
  `).join("");
}

async function fillAdProducts(){
  const select=document.getElementById("adProduct");

  select.innerHTML=
    `<option value="">— Product ምረጥ —</option>`+
    products.map(p=>
      `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)} — ${money(p.sell_price)}</option>`
    ).join("");
}

function updateAdTemplate(){
  const type=document.getElementById("adType").value;
  document.getElementById("adProductBox").style.display=
    type==="product" ? "block" : "none";

  if(type==="product"){
    const p=products.find(
      x=>String(x.id)===String(document.getElementById("adProduct").value)
    );

    if(p){
      document.getElementById("adTitle").value=p.name;
      document.getElementById("adText").value=
        `${p.description || ""}\n\n💰 ${money(p.sell_price)}\n📦 Stock: ${p.stock}`;
      document.getElementById("adPhoto").value=p.photo_url || "";

      if(p.photo_url) showPhotoPreview(p.photo_url,"ad");
    }
  }
}

document.getElementById("adProduct").addEventListener("change",updateAdTemplate);

async function openAdModal(){
  await loadChannels();
  await loadProducts();
  await fillAdProducts();

  document.getElementById("adForm").reset();
  document.getElementById("adPhoto").value="";
  removePhoto("ad");
  updateAdTemplate();

  document.getElementById("adModal").classList.remove("hidden");
}

document.getElementById("adForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const checked=[
    ...document.querySelectorAll("#adChannels input[type=checkbox]:checked")
  ];

  if(!checked.length){
    toast("❌ ቢያንስ አንድ Channel / Group ይምረጡ");
    return;
  }

  let photoUrl=document.getElementById("adPhoto").value.trim();

  try{

    if(window.selectedAdPhoto){
      toast("📤 ፎቶ በመጫን ላይ...");
      photoUrl=await uploadPhoto(
        window.selectedAdPhoto,
        "advertisements"
      );
    }

    /*
      Create one advertisement for each selected channel.
      This keeps compatibility with a server that stores
      one telegram_chat_id per advertisement.
    */

    const selectedIds=checked.map(x=>x.value);

    for(const channelId of selectedIds){

      const channel=channels.find(
        c=>String(c.id)===String(channelId)
      );

      const payload={
        ad_type:document.getElementById("adType").value,
        product_id:document.getElementById("adProduct").value || null,
        title:document.getElementById("adTitle").value.trim(),
        text:document.getElementById("adText").value.trim(),
        button_text:document.getElementById("adButtonText").value.trim(),
        photo_url:photoUrl,
        telegram_chat_id:
          channel?.chat_id ||
          channel?.telegram_chat_id ||
          channel?.chatId ||
          channelId
      };

      await api(API.ads,{
        method:"POST",
        body:JSON.stringify(payload)
      });
    }

    toast("📢 ማስታወቂያው ተቀምጧል");

    closeModal("adModal");
    window.selectedAdPhoto=null;

    await loadAdvertisements();

  }catch(error){
    toast("❌ "+error.message);
  }
});

async function publishAdvertisement(id){
  try{
    await api(API.ads+"/"+encodeURIComponent(id)+"/publish",{
      method:"POST"
    });

    toast("📢 ማስታወቂያው ተልኳል");
    await loadAdvertisements();

  }catch(error){
    toast("❌ "+error.message);
  }
}

async function deleteAdvertisement(id){
  if(!confirm("ይህን ማስታወቂያ ሰርዝ?")) return;

  try{
    await api(API.ads+"/"+encodeURIComponent(id),{
      method:"DELETE"
    });

    toast("ማስታወቂያው ተሰርዟል");

  }catch(error){

/* =========================
   CHANNELS
========================= */

async function loadChannels(){
  try{
    const result=await api(API.channels);

    channels=Array.isArray(result)
      ? result
      : result.channels || result.data || [];

    renderChannels();
    renderAdChannels();

  }catch(error){
    document.getElementById("channelsList").innerHTML=
      `<div class="muted">❌ ${escapeHtml(error.message)}</div>`;

    document.getElementById("adChannels").innerHTML=
      `<div class="muted">Telegram channels አልተገኙም</div>`;
  }
}

function renderChannels(){
  const el=document.getElementById("channelsList");

  if(!channels.length){
    el.innerHTML=`<div class="empty">📢 Channel / Group አልተጨመረም</div>`;
    return;
  }

  el.innerHTML=channels.map(c=>`
    <div class="card" style="padding:13px;margin-top:8px">
      <div style="display:flex;justify-content:space-between">
        <div>
          <b>${escapeHtml(c.name || c.title || "Telegram")}</b>
          <div class="muted">
            ${escapeHtml(c.username || c.chat_id || c.telegram_chat_id || "")}
          </div>
        </div>
        <span class="badge new">${escapeHtml(c.type || "channel")}</span>
      </div>

      <div class="actions">
        <button class="small-btn red" onclick="deleteChannel('${escapeHtml(c.id)}')">
          🗑️ Delete
        </button>
      </div>
    </div>
  `).join("");
}

function renderAdChannels(){
  const el=document.getElementById("adChannels");

  if(!channels.length){
    el.innerHTML=`<div class="muted">በመጀመሪያ Channel / Group ይጨምሩ</div>`;
    return;
  }

  el.innerHTML=channels.map(c=>`
    <label class="check-item">
      <input
        type="checkbox"
        value="${escapeHtml(c.id)}"
      >
      <span>
        <b>${escapeHtml(c.name || c.title || "Telegram")}</b>
        <small class="muted">
          ${escapeHtml(c.type || "channel")}
        </small>
      </span>
    </label>
  `).join("");
}

function openChannelModal(){
  document.getElementById("channelForm").reset();
  document.getElementById("channelId").value="";
  document.getElementById("telegramCheckResult").textContent="";
  document.getElementById("channelModal").classList.remove("hidden");
}

async function checkTelegramChat(){
  const chatId=document.getElementById("channelChatId").value.trim();

  if(!chatId){
    toast("Chat ID ያስገቡ");
    return;
  }

  try{
    const result=await api(
      API.telegramCheck+"?chat_id="+encodeURIComponent(chatId)
    );

    document.getElementById("telegramCheckResult").textContent=
      "✅ "+JSON.stringify(result);

  }catch(error){
    document.getElementById("telegramCheckResult").textContent=
      "❌ "+error.message;
  }
}

document.getElementById("channelForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const id=document.getElementById("channelId").value;

  const payload={
    name:document.getElementById("channelName").value.trim(),
    chat_id:document.getElementById("channelChatId").value.trim(),
    username:document.getElementById("channelUsername").value.trim(),
    type:document.getElementById("channelType").value
  };

  try{
    if(id){
      await api(API.channels+"/"+encodeURIComponent(id),{
        method:"PATCH",
        body:JSON.stringify(payload)
      });
    }else{
      await api(API.channels,{
        method:"POST",
        body:JSON.stringify(payload)
      });
    }

    toast("Telegram channel ተቀምጧል");
    closeModal("channelModal");
    await loadChannels();

  }catch(error){
    toast("❌ "+error.message);
  }
});

async function deleteChannel(id){
  if(!confirm("ይህን Channel / Group ሰርዝ?")) return;

  try{
    await api(API.channels+"/"+encodeURIComponent(id),{
      method:"DELETE"
    });

    toast("Channel ተሰርዟል");
    await loadChannels();

  }catch(error){
    toast("❌ "+error.message);
  }
}

  const sales=Number(
    data?.sales ??
    data?.today_sales ??
    data?.total_sales ??
    0
  );

  const profit=Number(
    data?.profit ??
    data?.today_profit ??
    data?.total_profit ??
    0
  );

  const ordersCount=Number(
    data?.orders ??

      <div class="report-box">
        <div class="muted">Stock</div>
        <b>${stock}</b>

      <h4>📊 Product Profit</h4>
      <div class="muted">
        ትርፍ = የሽያጭ ዋጋ − የግዢ ዋጋ

    </div>
  `;
}

/* =========================
   STATS
========================= */

function updateStats(){
  const sales=orders
    .filter(o=>String(o.status).toUpperCase().includes("CONFIRM"))
    .reduce((sum,o)=>sum+Number(o.total||0),0);

  const stock=products.reduce((sum,p)=>sum+Number(p.stock||0),0);

  const profit=orders
    .filter(o=>String(o.status).toUpperCase().includes("CONFIRM"))
    .reduce((sum,o)=>{
      const p=products.find(
        x=>String(x.id)===String(o.product_id)
      );

      if(!p) return sum;

      return sum+
        (Number(p.sell_price)-Number(p.buy_price))*
        Number(o.quantity||1);
    },0);

  document.getElementById("statSales").textContent=money(sales);
  document.getElementById("statProfit").textContent=money(profit);
  document.getElementById("statOrders").textContent=orders.length;
  document.getElementById("statStock").textContent=stock;
}
